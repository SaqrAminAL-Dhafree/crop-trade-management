name: mogot_app

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2
  pdf: ^3.10.4
  printing: ^5.12.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.13.1

# =========================
# 🔥 إعداد أيقونة التطبيق
# =========================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

# =========================
# 🔥 إعدادات Flutter
# =========================

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf